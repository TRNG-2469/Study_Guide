  # Artifacts are files GitLab saves after a job completes.
  # Other jobs can download them, and they appear in the GitLab pipeline UI.
  artifacts:
    paths:
      # TODO: Specify the path to the JAR file Maven produces.
      #       Maven always outputs build artifacts to the target/ directory.
      #       Use a glob pattern so it works regardless of the JAR filename.
    expire_in: # TODO: How long should GitLab keep this artifact?
               #       Examples: 1 hour | 1 day | 1 week


# =============================================================================
# JOB 2: test-app
# Stage: test
# Purpose: Run the project's unit and integration tests.
#          Publishes JUnit XML reports so GitLab can display pass/fail counts.
# =============================================================================
test-app:
