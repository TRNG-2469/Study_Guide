# -----------------------------------------------------------------------------
# STAGES
# Defines the order in which job groups run.
# Jobs in the same stage run in PARALLEL.
# Jobs in the next stage wait for ALL jobs in the previous stage to pass.
# -----------------------------------------------------------------------------
stages:
  - build
  - test
  - deploy


# -----------------------------------------------------------------------------
# GLOBAL VARIABLES
# These are available in every job's script section as environment variables.
# MAVEN_OPTS tells Maven to store downloaded dependencies inside the project
# directory so GitLab's cache system can save and restore them.
# -----------------------------------------------------------------------------
variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"


# -----------------------------------------------------------------------------
# GLOBAL CACHE
# GitLab saves the listed paths between pipeline runs.
# cache.key uses the branch name so each branch has its own independent cache.
# This prevents a feature branch from corrupting the main branch cache.
# -----------------------------------------------------------------------------
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository


# =============================================================================
# JOB 1: build-app
# Stage: build
# Purpose: Compile the source code and package a runnable JAR file.
#          The JAR is stored as a pipeline artifact so later jobs can use it.
# =============================================================================
build-app:
  stage: build

  # The Docker image that provides Java + Maven for this job.
  # GitLab pulls this image from Docker Hub and runs your script inside it.
