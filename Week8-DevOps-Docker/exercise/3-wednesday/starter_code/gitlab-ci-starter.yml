        #       Hint: target/surefire-reports/TEST-*.xml


# =============================================================================
# JOB 3: deploy-staging
# Stage: deploy
# Purpose: Deploy the built JAR to the staging environment.
#          This job does NOT run automatically — a human must click the play button.
# =============================================================================
deploy-staging:
  stage: deploy

  # "when: manual" means this job waits for a human to trigger it.
  # In the pipeline UI, it shows a ▶ play button instead of running automatically.
  when: manual

  # The environment block links this job to a GitLab Environment.
  # GitLab tracks which commit is deployed where under Deployments → Environments.
  environment:
    name: staging
    url: $DEPLOY_TARGET_URL   # Uses the masked CI/CD variable you created in Task 5

  # "needs" declares an explicit dependency on the build-app job.
  # artifacts: true downloads the JAR artifact from build-app before running scripts.
  # Without this, the target/ directory would be empty in this job.
  needs:
    - job: build-app
      artifacts: true

